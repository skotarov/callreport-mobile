name: Android Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-unit-tests.yml
      - mobile/calllog-android/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-unit-tests.yml
      - mobile/calllog-android/**

permissions:
  contents: write

jobs:
  apply-final-identity-safeguards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-note-author-id
          fetch-depth: 0

      - name: Apply structural Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog')

          store = root / 'CompanySessionStore.kt'
          text = store.read_text()
          start = text.index('    fun updateProfile(context: Context, user: CompanyAccountApi.ProfileUser) {')
          end = text.index('\n    /** Updates only the locally visible name', start)
          method = '''    fun updateProfile(context: Context, user: CompanyAccountApi.ProfileUser) {
              val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              val editor = prefs.edit()
                  .putString(KEY_USER_NAME, user.name)
                  .putString(KEY_USER_EMAIL, user.email)
                  .putString(KEY_USER_PHONE, user.phone)
                  .putBoolean(KEY_EMAIL_VERIFIED, user.emailVerified)
                  .putBoolean(KEY_PHONE_VERIFIED, user.phoneVerified)
              // Some legacy profile-update responses omit the stable ID. Never erase
              // the authenticated identity merely because that optional field is absent.
              if (user.userId.isNotBlank()) editor.putString(KEY_USER_ID, user.userId)
              editor.apply()
          }
          '''
          store.write_text(text[:start] + method + text[end:])

          lookup = root / 'CallReportHistoryLookupClient.kt'
          text = lookup.read_text()
          old_broker = 'authorBrokerId = item.text("author_broker_id", "created_by_broker_id", "note_author_broker_id", "author_employee_id", "author_id"),'
          new_broker = 'authorBrokerId = item.text("author_broker_id", "created_by_broker_id", "note_author_broker_id", "author_employee_id"),'
          if text.count(old_broker) != 1:
              raise SystemExit(f'authorBrokerId match count: {text.count(old_broker)}')
          text = text.replace(old_broker, new_broker, 1)
          profile_line = '                            "note_author_profile_id",\n'
          if text.count(profile_line) != 1:
              raise SystemExit(f'authorProfileId line count: {text.count(profile_line)}')
          text = text.replace(profile_line, profile_line + '                            "author_id",\n', 1)
          lookup.write_text(text)
          PY

      - name: Commit clean Android changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/android-unit-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Keep note author IDs stable across profile updates'
          git push origin HEAD:agent/fix-note-author-id

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/calllog-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Run debug unit tests
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest
