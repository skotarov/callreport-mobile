name: Android Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-unit-tests.yml
      - mobile/calllog-android/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-unit-tests.yml
      - mobile/calllog-android/**

permissions:
  contents: write

jobs:
  apply-note-author-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-note-author-id
          fetch-depth: 0

      - name: Apply verified identity patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-note-author-id-fix.yml > /tmp/apply-note-author-id.py
          test -s /tmp/apply-note-author-id.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-note-author-id.py')
          script = path.read_text()
          marker = "'CompanySessionStore load ID')"
          end = script.index(marker) + len(marker)
          start = script.rfind('p = replace_once(p,', 0, end)
          if start < 0:
              raise SystemExit('Could not locate strict CompanySessionStore load-ID patch')
          replacement = '''needle = '            organizationId = prefs.getString(KEY_ORGANIZATION_ID, "").orEmpty().trim(),\\n'
if p.count(needle) != 1:
    raise SystemExit(f'CompanySessionStore load ID line: expected one match, found {p.count(needle)}')
p = p.replace(
    needle,
    needle + '            userId = prefs.getString(KEY_USER_ID, "").orEmpty().trim(),\\n',
    1,
)'''
          script = script[:start] + replacement + script[end:]
          path.write_text(script)
          PY
          python3 /tmp/apply-note-author-id.py

      - name: Commit clean Android changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-note-author-id-fix.yml
          git checkout origin/main -- .github/workflows/android-unit-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use stable profile IDs for note ownership'
          git push origin HEAD:agent/fix-note-author-id

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/calllog-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Run debug unit tests
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest
