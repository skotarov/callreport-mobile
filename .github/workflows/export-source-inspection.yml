name: Apply Popup Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/popup-server-general-notes
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/popup-fix.patch.gz
          for sha in \
            380ee5c5a7b0803c60704c331c37ac5d6b467892 \
            e664e82dbdf1502e91ef57ef37a8ac72199fab8b \
            f9ff03637d6c871026d8afbb245c747644ef51a2 \
            31f1686ebf258b644aaa98321be6414588bb3029
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | python -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              >> /tmp/popup-fix.patch.gz
          done
          echo 'c6f23f8571891829f6f609a6ddff6af27709c1b658e71e92674ba2a55eae4dc3  /tmp/popup-fix.patch.gz' | sha256sum --check
          gzip -dc /tmp/popup-fix.patch.gz > /tmp/popup-fix.patch
          echo 'e1010daeb8b5732c9a46a8a623cd4d1900edf70a77f03e0ef87d68da05ba025a  /tmp/popup-fix.patch' | sha256sum --check
          git apply --check /tmp/popup-fix.patch
          git apply /tmp/popup-fix.patch

      - name: Commit clean Android change
        run: |
          set -euo pipefail
          rm -rf .github/popup-fix-parts
          rm -f .github/workflows/export-source-inspection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Show server general notes in call popup'
          git push origin HEAD:agent/popup-server-general-notes
