name: Apply Pagination Fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pagination-fixes:
    if: github.head_ref == 'agent/page-size-10-pagination' || github.ref_name == 'agent/page-size-10-pagination'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/page-size-10-pagination
          fetch-depth: 0

      - name: Apply targeted Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('mobile/calllog-android')
          source = root / 'app/src/main/java/com/onlineimoti/calllog'

          path = source / 'AppConfig.kt'
          text = path.read_text()
          text = text.replace(
              'import android.content.Context\nimport android.net.Uri\n',
              'import android.content.Context\nimport android.content.SharedPreferences\nimport android.net.Uri\n',
          )
          text = text.replace(
              '    private const val KEY_HOME_CALL_PAGE_SIZE = "home_call_page_size"\n',
              '    private const val KEY_HOME_CALL_PAGE_SIZE = "home_call_page_size"\n'
              '    private const val KEY_HOME_CALL_PAGE_SIZE_DEFAULT_10_MIGRATED = "home_call_page_size_default_10_migrated"\n',
          )
          text = text.replace(
              '    const val DEFAULT_HOME_CALL_PAGE_SIZE = 20\n',
              '    private const val LEGACY_DEFAULT_HOME_CALL_PAGE_SIZE = 20\n'
              '    const val DEFAULT_HOME_CALL_PAGE_SIZE = 10\n',
          )
          text = text.replace(
              '            homeCallPageSize = prefs.getInt(KEY_HOME_CALL_PAGE_SIZE, DEFAULT_HOME_CALL_PAGE_SIZE).coerceHomeCallPageSize(),\n',
              '            homeCallPageSize = loadHomeCallPageSize(prefs),\n',
          )
          text = text.replace(
              '            .putInt(KEY_HOME_CALL_PAGE_SIZE, normalized.homeCallPageSize)\n',
              '            .putInt(KEY_HOME_CALL_PAGE_SIZE, normalized.homeCallPageSize)\n'
              '            .putBoolean(KEY_HOME_CALL_PAGE_SIZE_DEFAULT_10_MIGRATED, true)\n',
          )
          text = text.replace(
              '    fun localeTagForLanguage(language: String): String {\n',
              '    fun homeCallPageSize(context: Context): Int = load(context).homeCallPageSize\n\n'
              '    fun localeTagForLanguage(language: String): String {\n',
          )
          old = '    private fun Int.coerceHomeCallPageSize(): Int = coerceIn(MIN_HOME_CALL_PAGE_SIZE, MAX_HOME_CALL_PAGE_SIZE)\n\n'
          new = '''    private fun loadHomeCallPageSize(prefs: SharedPreferences): Int {
              val migrationDone = prefs.getBoolean(KEY_HOME_CALL_PAGE_SIZE_DEFAULT_10_MIGRATED, false)
              val storedValue = if (prefs.contains(KEY_HOME_CALL_PAGE_SIZE)) {
                  prefs.getInt(KEY_HOME_CALL_PAGE_SIZE, DEFAULT_HOME_CALL_PAGE_SIZE)
              } else {
                  null
              }
              val pageSize = migratedHomeCallPageSize(storedValue, migrationDone)
              if (!migrationDone) {
                  prefs.edit()
                      .putInt(KEY_HOME_CALL_PAGE_SIZE, pageSize)
                      .putBoolean(KEY_HOME_CALL_PAGE_SIZE_DEFAULT_10_MIGRATED, true)
                      .commit()
              }
              return pageSize
          }

          internal fun migratedHomeCallPageSize(storedValue: Int?, migrationDone: Boolean): Int {
              val normalized = (storedValue ?: DEFAULT_HOME_CALL_PAGE_SIZE).coerceHomeCallPageSize()
              return if (!migrationDone && (storedValue == null || normalized == LEGACY_DEFAULT_HOME_CALL_PAGE_SIZE)) {
                  DEFAULT_HOME_CALL_PAGE_SIZE
              } else {
                  normalized
              }
          }

          private fun Int.coerceHomeCallPageSize(): Int = coerceIn(MIN_HOME_CALL_PAGE_SIZE, MAX_HOME_CALL_PAGE_SIZE)

          '''
          if old not in text:
              raise SystemExit('AppConfig page-size insertion point was not found')
          path.write_text(text.replace(old, new))

          path = source / 'EdgePageScrollController.kt'
          text = path.read_text()
          text = text.replace(
              '    private val loadingIndicatorLeadMs: Long = 0L,\n'
              '    private val onLoadingChanged: (Boolean) -> Unit = {},\n',
              '    private val loadingIndicatorLeadMs: Long = 0L,\n'
              '    private val onLoadingChanged: (Boolean) -> Unit = {},\n'
              '    private val onLoadingStillPending: () -> Unit = {},\n',
          )
          text = text.replace(
              '        override fun run() {\n'
              '            if (!pendingNext) return\n'
              '            val scroll = scrollView\n',
              '        override fun run() {\n'
              '            if (!pendingNext) return\n'
              '            onLoadingStillPending()\n'
              '            val scroll = scrollView\n',
          )
          path.write_text(text)

          path = source / 'HomeNotesPagingController.kt'
          text = path.read_text()
          old = '''            } else {
                  finishPagingStatus()
                  HomeLoadingFooterUi.hide(binding.homeCallsContainer)
              }
          },
      )
          '''
          new = '''            } else {
                  finishPagingStatus()
                  HomeLoadingFooterUi.hide(binding.homeCallsContainer)
              }
          },
          // Supplemental note/name renders may briefly rebuild the current page while
          // the next page is still loading. Keep the bottom spinner visible until the
          // edge controller confirms that the new page is stable.
          onLoadingStillPending = {
              HomeLoadingFooterUi.show(binding.homeCallsContainer)
          },
      )
          '''
          if old not in text:
              raise SystemExit('Home paging callback insertion point was not found')
          path.write_text(text.replace(old, new))

          path = source / 'RecentCallsActivity.kt'
          text = path.read_text()
          text = text.replace(
              '        val calls = if (isFiltered) {\n',
              '        val pageSize = ConfigStore.homeCallPageSize(this)\n'
              '        val calls = if (isFiltered) {\n',
          )
          text = text.replace('                pageSize = 50,\n', '                pageSize = pageSize,\n')
          text = text.replace(
              '            PhoneCallReader.recentCalls(this, limit = 20)\n',
              '            PhoneCallReader.recentCalls(this, limit = pageSize)\n',
          )
          path.write_text(text)

          for layout_name in ('section_call_log_settings.xml', 'section_contact_filter.xml'):
              path = root / 'app/src/main/res/layout' / layout_name
              path.write_text(path.read_text().replace('android:text="20"', 'android:text="10"'))

          test_path = root / 'app/src/test/java/com/onlineimoti/calllog/ConfigStorePageSizeTest.kt'
          test_path.write_text('''package com.onlineimoti.calllog

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class ConfigStorePageSizeTest {
              @Test
              fun defaultPageSizeIsTen() {
                  assertEquals(10, ConfigStore.DEFAULT_HOME_CALL_PAGE_SIZE)
                  assertEquals(10, ConfigStore.migratedHomeCallPageSize(storedValue = null, migrationDone = false))
              }

              @Test
              fun oldDefaultTwentyMigratesOnceToTen() {
                  assertEquals(10, ConfigStore.migratedHomeCallPageSize(storedValue = 20, migrationDone = false))
                  assertEquals(20, ConfigStore.migratedHomeCallPageSize(storedValue = 20, migrationDone = true))
              }

              @Test
              fun explicitCustomPageSizeIsPreserved() {
                  assertEquals(15, ConfigStore.migratedHomeCallPageSize(storedValue = 15, migrationDone = false))
              }
          }
          ''')
          PY

          git rm .github/workflows/export-source-inspection.yml
          git diff --check

      - name: Commit task changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/calllog-android
          git commit -m "Use 10-row pages and preserve paging spinner"
          git push origin HEAD:agent/page-size-10-pagination
