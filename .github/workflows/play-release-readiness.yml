name: Play Release Readiness

on:
  push:
    branches: [main]
    paths:
      - 'mobile/calllog-android/**'
      - '.github/workflows/play-release-readiness.yml'
  pull_request:
    paths:
      - 'mobile/calllog-android/**'
      - '.github/workflows/play-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-manifest-and-build:
    name: Verify single Play-ready manifest and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/calllog-android
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Verify merged app manifest
        run: bash tools/play/verify-play-manifest.sh

      - name: Compile debug variant
        run: gradle --no-daemon :app:assembleDebug
