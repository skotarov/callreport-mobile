name: Agent Show Main Notes Without CRM

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-server-main-notes-without-crm-20260804
      - name: Apply History and Home visibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          history = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/HistoryBackgroundLoader.kt')
          text = history.read_text()
          replacements = [
              (
                  '            val companies = if (companyScopeAvailable) cachedHistoryCompanies(context) else emptyList()\n',
                  '            val companies = cachedHistoryCompanies(context)\n',
              ),
              (
                  '        val cachedScope = if (snapshot.companyScopeAvailable && key.isNotBlank()) {\n',
                  '        val cachedScope = if (key.isNotBlank()) {\n',
              ),
              (
                  '''        return HistoryPreparedSnapshot(\n            rows = localRows.filter { row -> row.kind != CallReportHistoryRowKind.PHONE },\n            fullLogEntries = FilteredFullLogLoader.groupedEntries(localRows),\n            companyMainNotes = cachedCompanyNotes,\n            hasCompanyMainNoteScope = cachedCompanyNotes.isNotEmpty(),\n        )\n''',
                  '''        val visibleCompanyNotes = CompanyMainNoteVisibilityPolicy.visibleNotes(\n            companyScopeAvailable = snapshot.companyScopeAvailable,\n            notes = cachedCompanyNotes,\n        )\n        return HistoryPreparedSnapshot(\n            rows = localRows.filter { row -> row.kind != CallReportHistoryRowKind.PHONE },\n            fullLogEntries = FilteredFullLogLoader.groupedEntries(localRows),\n            companyMainNotes = visibleCompanyNotes,\n            hasCompanyMainNoteScope = CompanyMainNoteVisibilityPolicy.shouldShow(\n                companyScopeAvailable = snapshot.companyScopeAvailable,\n                notes = visibleCompanyNotes,\n            ),\n        )\n''',
              ),
              (
                  '''        val companyScopeAvailable = remoteEnabled && ContactServerCompanyScope.isAvailable(context, phone)\n        val scopedCompanies = when {\n            !companyScopeAvailable -> emptyList()\n            scopedServerLoaded -> history.principal.companies\n            else -> cachedHistoryCompanies(context, config)\n        }\n''',
                  '''        val companyScopeAvailable = remoteEnabled && ContactServerCompanyScope.isAvailable(context, phone)\n        // Existing server notes are readable even when this known contact is not\n        // enrolled in CRM. CRM still controls empty lanes and creation controls.\n        val scopedCompanies = when {\n            scopedServerLoaded -> history.principal.companies\n            else -> cachedHistoryCompanies(context, config)\n        }\n''',
              ),
              (
                  '''        val localTimeline = FilteredFullLogLocalData(\n            calls = localCalls,\n            sms = localSms,\n            notes = localNotes,\n        )\n        return HistoryPreparedSnapshot(\n''',
                  '''        val localTimeline = FilteredFullLogLocalData(\n            calls = localCalls,\n            sms = localSms,\n            notes = localNotes,\n        )\n        val allCompanyMainNotes = companyMainNotes(\n            context = context,\n            phone = phone,\n            serverLoaded = scopedServerLoaded,\n            companies = scopedCompanies,\n            events = history.events,\n        )\n        val visibleCompanyMainNotes = CompanyMainNoteVisibilityPolicy.visibleNotes(\n            companyScopeAvailable = companyScopeAvailable,\n            notes = allCompanyMainNotes,\n        )\n        return HistoryPreparedSnapshot(\n''',
              ),
              (
                  '''            companyMainNotes = companyMainNotes(\n                context = context,\n                phone = phone,\n                serverLoaded = scopedServerLoaded,\n                companies = scopedCompanies,\n                events = history.events,\n            ),\n''',
                  '''            companyMainNotes = visibleCompanyMainNotes,\n''',
              ),
              (
                  '            hasCompanyMainNoteScope = scopedCompanies.isNotEmpty(),\n',
                  '''            hasCompanyMainNoteScope = CompanyMainNoteVisibilityPolicy.shouldShow(\n                companyScopeAvailable = companyScopeAvailable,\n                notes = visibleCompanyMainNotes,\n            ),\n''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'History block not found: {old[:100]!r}')
          history.write_text(text)

          section = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/CompanyScopedGeneralNoteSectionUi.kt')
          text = section.read_text()
          replacements = [
              (
                  '''        addUnscopedServerMainNote(section, unscopedServerMainNote, onEditUnscopedServerMainNote)\n        if (!showCompanyNotes || !companyScopeAvailable) return\n\n        companyNotes\n''',
                  '''        addUnscopedServerMainNote(section, unscopedServerMainNote, onEditUnscopedServerMainNote)\n        if (!showCompanyNotes) return\n        val visibleCompanyNotes = CompanyMainNoteVisibilityPolicy.visibleNotes(\n            companyScopeAvailable = companyScopeAvailable,\n            notes = companyNotes,\n        )\n        if (visibleCompanyNotes.isEmpty()) return\n\n        visibleCompanyNotes\n''',
              ),
              (
                  '''                    onEditCompany = onEditCompany,\n                    phaseBarForCompany = phaseBarForCompany,\n''',
                  '''                    onEditCompany = onEditCompany,\n                    allowAdd = companyScopeAvailable,\n                    phaseBarForCompany = phaseBarForCompany.takeIf { companyScopeAvailable },\n''',
              ),
              (
                  '''        notes: List<CallReportCompanyMainNote>,\n        onEditCompany: (String) -> Unit,\n        phaseBarForCompany: ((String) -> View)?,\n''',
                  '''        notes: List<CallReportCompanyMainNote>,\n        onEditCompany: (String) -> Unit,\n        allowAdd: Boolean,\n        phaseBarForCompany: ((String) -> View)?,\n''',
              ),
              (
                  '        val showAdd = if (multiAuthor) !hasEditableNote else visibleNotes.isEmpty()\n',
                  '        val showAdd = allowAdd && if (multiAuthor) !hasEditableNote else allowAdd && visibleNotes.isEmpty()\n',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Section block not found: {old[:100]!r}')
          section.write_text(text)

          home = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/HomeCompanyGeneralNoteLabels.kt')
          text = home.read_text()
          old = '''        val serverBackedPhoneKeys = result.events\n            .asSequence()\n            .filter { event ->\n                event.communicationType.equals("note", ignoreCase = true) &&\n                    event.note.trim().isNotBlank()\n            }\n            .mapTo(linkedSetOf()) { HomeCallPageLoader.noteKey(it.phone) }\n            .filterTo(linkedSetOf()) { it.isNotBlank() && it in requestedPhoneKeys }\n'''
          new = '''        val serverBackedPhoneKeys = buildSet {\n            result.events.asSequence()\n                .filter { event ->\n                    event.communicationType.equals("note", ignoreCase = true) &&\n                        event.note.trim().isNotBlank()\n                }\n                .map { event -> HomeCallPageLoader.noteKey(event.phone) }\n                .filter { key -> key.isNotBlank() && key in requestedPhoneKeys }\n                .forEach(::add)\n            result.companyMainNotes.asSequence()\n                .filter { note -> note.note.trim().isNotBlank() }\n                .map { note -> HomeCallPageLoader.noteKey(note.phone) }\n                .filter { key -> key.isNotBlank() && key in requestedPhoneKeys }\n                .forEach(::add)\n        }\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Home server-backed key block not found')
          needle = '''        for (event in result.events) {\n            if (event.note.isBlank() || event.companyId.isBlank()) continue\n            val phoneKey = HomeCallPageLoader.noteKey(event.phone)\n            if (phoneKey.isBlank() || phoneKey !in requestedPhoneKeys) continue\n\n            if (CallReportServerNoteClassifier.isExplicitGeneralNote(event)) {\n                confirmedGeneralScopes += scopeKey(phoneKey, event.companyId)\n                labelFor(phoneKey, event.companyId).setServerGeneralNote(\n                    text = event.note,\n                    changedAtMs = maxOf(event.updatedAtMs, event.occurredAtMs, event.createdAtMs),\n                )\n            }\n        }\n\n'''
          addition = needle + '''        // The dedicated collection is canonical and remains visible even when\n        // the phone is a known Android contact with CRM turned off.\n        for (note in result.companyMainNotes) {\n            if (note.note.isBlank() || note.companyId.isBlank()) continue\n            val phoneKey = HomeCallPageLoader.noteKey(note.phone)\n            if (phoneKey.isBlank() || phoneKey !in requestedPhoneKeys) continue\n            confirmedGeneralScopes += scopeKey(phoneKey, note.companyId)\n            labelFor(phoneKey, note.companyId).setServerGeneralNote(\n                text = note.note,\n                changedAtMs = note.updatedAtMs,\n            )\n        }\n\n'''
          if needle in text and 'The dedicated collection is canonical' not in text:
              text = text.replace(needle, addition, 1)
          elif 'The dedicated collection is canonical' not in text:
              raise SystemExit('Home general-note loop not found')
          home.write_text(text)
          PY
          git config user.name "relationship-manager-agent"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/HistoryBackgroundLoader.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/CompanyScopedGeneralNoteSectionUi.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/HomeCompanyGeneralNoteLabels.kt
          if ! git diff --cached --quiet; then
            git commit -m "Show existing company main notes without CRM"
          fi
          git rm .github/workflows/agent-show-main-notes-without-crm.yml
          git commit -m "Remove temporary main-note patch workflow"
          git push origin HEAD:agent/show-server-main-notes-without-crm-20260804
