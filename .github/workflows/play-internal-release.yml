name: Play Internal Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code; leave empty to generate one from UTC date and time'
        required: false
        type: string
      version_name:
        description: 'Visible version name'
        required: false
        default: '0.4.0-internal'
        type: string
      publish_internal:
        description: 'Upload the signed AAB to the Google Play internal testing track'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/calllog-android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version_code="$REQUESTED_VERSION_CODE"
          if [[ -z "$version_code" ]]; then
            year=$((10#$(date -u +%y)))
            day=$((10#$(date -u +%j)))
            hour=$((10#$(date -u +%H)))
            minute=$((10#$(date -u +%M)))
            version_code=$((1000000000 + year * 10000000 + day * 10000 + hour * 100 + minute))
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          (( version_code <= 2100000000 ))

          version_name="$REQUESTED_VERSION_NAME"
          [[ -n "$version_name" ]] || version_name="0.4.$version_code"

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          printf 'Building version %s (%s)\n' "$version_name" "$version_code"

      - name: Restore upload signing key
        shell: bash
        env:
          RM_UPLOAD_KEYSTORE_B64: ${{ secrets.RM_UPLOAD_KEYSTORE_B64 }}
          RM_UPLOAD_STORE_PASSWORD: ${{ secrets.RM_UPLOAD_STORE_PASSWORD }}
          RM_UPLOAD_KEY_ALIAS: ${{ secrets.RM_UPLOAD_KEY_ALIAS }}
          RM_UPLOAD_KEY_PASSWORD: ${{ secrets.RM_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$RM_UPLOAD_KEYSTORE_B64" ]] || { echo 'Missing RM_UPLOAD_KEYSTORE_B64 secret.' >&2; exit 1; }
          [[ -n "$RM_UPLOAD_STORE_PASSWORD" ]] || { echo 'Missing RM_UPLOAD_STORE_PASSWORD secret.' >&2; exit 1; }
          [[ -n "$RM_UPLOAD_KEY_ALIAS" ]] || { echo 'Missing RM_UPLOAD_KEY_ALIAS secret.' >&2; exit 1; }
          [[ -n "$RM_UPLOAD_KEY_PASSWORD" ]] || { echo 'Missing RM_UPLOAD_KEY_PASSWORD secret.' >&2; exit 1; }

          keystore="$RUNNER_TEMP/relationship-manager-upload.jks"
          printf '%s' "$RM_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          printf 'storeFile=%s\nstoreSecret=%s\nkeyAlias=%s\nkeySecret=%s\n' \
            "$keystore" \
            "$RM_UPLOAD_STORE_PASSWORD" \
            "$RM_UPLOAD_KEY_ALIAS" \
            "$RM_UPLOAD_KEY_PASSWORD" \
            > play-signing.properties
          chmod 600 play-signing.properties

          keytool -list \
            -keystore "$keystore" \
            -storepass "$RM_UPLOAD_STORE_PASSWORD" \
            -alias "$RM_UPLOAD_KEY_ALIAS" > /dev/null

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            -PplayVersionCode='${{ steps.version.outputs.version_code }}' \
            -PplayVersionName='${{ steps.version.outputs.version_name }}'

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/relationship-manager-release.apk'
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -f "$apk"
          test -f "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab" > /dev/null

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relationship-manager-play-${{ steps.version.outputs.version_code }}
          path: |
            mobile/calllog-android/app/build/outputs/apk/release/relationship-manager-release.apk
            mobile/calllog-android/app/build/outputs/bundle/release/app-release.aab
            mobile/calllog-android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Google Cloud CLI
        if: ${{ inputs.publish_internal }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to Google Play internal testing
        if: ${{ inputs.publish_internal }}
        shell: bash
        env:
          RM_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.RM_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$RM_PLAY_SERVICE_ACCOUNT_JSON" ]] || { echo 'Missing RM_PLAY_SERVICE_ACCOUNT_JSON secret.' >&2; exit 1; }
          service_account="$RUNNER_TEMP/relationship-manager-play-service-account.json"
          printf '%s' "$RM_PLAY_SERVICE_ACCOUNT_JSON" > "$service_account"
          chmod 600 "$service_account"
          bash tools/play/playctl.sh publish-internal \
            "$service_account" \
            app/build/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f play-signing.properties
          rm -f "$RUNNER_TEMP/relationship-manager-upload.jks"
          rm -f "$RUNNER_TEMP/relationship-manager-play-service-account.json"
