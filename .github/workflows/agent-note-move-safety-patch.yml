name: Agent Note Move Safety Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-note-between-companies-20260804
      - name: Apply confirmed-id and stale-cache safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          activity = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteEditActivity.kt')
          text = activity.read_text()
          text = text.replace(
              'confirmedServer = serverClientEventId.isNotBlank(),',
              'confirmedServer = serverClientEventId.isNotBlank() &&\n                        ServerRecordIndex.isConfirmed(this, serverClientEventId),',
              1,
          )
          text = text.replace(
              'ContactNoteMoveClient.applyLocalResult(applicationContext, draft(), sourceCompanyId, moved)',
              'ContactNoteMoveClient.applyLocalResult(\n                        applicationContext,\n                        draft(),\n                        sourceCompanyId,\n                        sourceValue.serverClientEventId,\n                        moved,\n                    )',
              1,
          )
          activity.write_text(text)

          overlay = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/OverlayContactNoteFormController.kt')
          text = overlay.read_text()
          text = text.replace(
              'confirmedServer = draft.serverClientEventId.isNotBlank(),',
              'confirmedServer = draft.serverClientEventId.isNotBlank() &&\n                ServerRecordIndex.isConfirmed(service, draft.serverClientEventId),',
              1,
          )
          text = text.replace(
              'ContactNoteMoveClient.applyLocalResult(service.applicationContext, draft, sourceCompanyId, moved)',
              'ContactNoteMoveClient.applyLocalResult(\n                        service.applicationContext,\n                        draft,\n                        sourceCompanyId,\n                        sourceValue.serverClientEventId,\n                        moved,\n                    )',
              1,
          )
          overlay.write_text(text)
          PY
          git config user.name "relationship-manager-agent"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteEditActivity.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/OverlayContactNoteFormController.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden local state after company note moves"
          git push origin HEAD:agent/move-note-between-companies-20260804
