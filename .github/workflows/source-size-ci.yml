name: Source Size Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Report source files over 350 lines
        run: python3 tools/quality/report_large_source_files.py --threshold 350 --fail
