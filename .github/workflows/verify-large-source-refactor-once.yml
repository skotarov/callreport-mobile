name: One-time Android refactor verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/limit-source-files-300
          fetch-depth: 0
      - name: Verification temporarily paused
        run: echo "Direct compile fixes are being applied as one verified branch state."
