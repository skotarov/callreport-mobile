name: One-time Android refactor verification

on:
  push:
    branches:
      - agent/limit-source-files-300

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[android-refactor-verify]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/limit-source-files-300
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply fixes, compile, test and lint
        shell: bash
        run: |
          set +e
          : > /tmp/android-refactor.log
          python3 tools/quality/fix_android_refactor_compile.py >> /tmp/android-refactor.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 tools/quality/report_large_source_files.py --threshold 350 --fail >> /tmp/android-refactor.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0" >> /tmp/android-refactor.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cd mobile/calllog-android
            gradle --no-daemon compileDebugKotlin testDebugUnitTest lintDebug >> /tmp/android-refactor.log 2>&1
            status=$?
            cd ../..
          fi

          git config user.name "relationship-manager-refactor"
          git config user.email "actions@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            tail -n 500 /tmp/android-refactor.log > android_refactor_build_failure.log
            git add android_refactor_build_failure.log
            git commit -m "[android-refactor-verify] Capture verification failure"
            git push origin HEAD:agent/limit-source-files-300
            cat /tmp/android-refactor.log
            exit "$status"
          fi

          rm -f android_refactor_build_failure.log
          rm tools/quality/fix_android_refactor_compile.py
          rm .github/workflows/verify-large-source-refactor-once.yml
          git add -A
          git commit -m "[android-refactor-verify] Compile, unit tests and lint passed"
          git push origin HEAD:agent/limit-source-files-300
