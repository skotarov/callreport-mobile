name: One-time large Android refactor

on:
  push:
    branches:
      - agent/limit-source-files-300

permissions:
  contents: write

jobs:
  split-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[large-source-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/limit-source-files-300
          fetch-depth: 0

      - name: Split intact Kotlin responsibilities
        run: python3 tools/quality/refactor_large_sources.py

      - name: Verify oversized-source inventory
        run: python3 tools/quality/report_large_source_files.py --threshold 350 --fail

      - name: Remove one-time migration files
        run: rm tools/quality/refactor_large_sources.py .github/workflows/refactor-large-sources-once.yml

      - name: Commit structural refactor
        run: |
          git config user.name "relationship-manager-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[large-source-refactor] Split oversized Android sources safely"
          git push origin HEAD:agent/limit-source-files-300
