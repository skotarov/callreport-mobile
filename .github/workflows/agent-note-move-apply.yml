name: Agent Apply Note Move UI

on:
  push:
    branches:
      - agent/move-note-between-companies-20260804

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-note-between-companies-20260804
      - name: Apply reviewed Android note move files
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/note-move-patch/part* | base64 -d | tar -xzf -
          git config user.name "relationship-manager-agent"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteEditActivity.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteEditUi.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteScopeTextController.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteScopeTextResolver.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ContactNoteTopicFieldUi.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/OverlayContactNoteFormController.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/PostCallUnifiedNoteEditor.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add in-place company note move UI"
          git push origin HEAD:agent/move-note-between-companies-20260804
