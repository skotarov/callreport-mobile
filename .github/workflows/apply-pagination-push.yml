name: Run Pagination Patch

on:
  push:
    branches:
      - agent/page-size-10-pagination

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/page-size-10-pagination
          fetch-depth: 0

      - name: Apply and commit pagination changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/pagination-fixes.patch
          git apply .ci/pagination-fixes.patch

          cat > mobile/calllog-android/app/src/test/java/com/onlineimoti/calllog/ConfigStorePageSizeTest.kt <<'EOF'
          package com.onlineimoti.calllog

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class ConfigStorePageSizeTest {
              @Test
              fun defaultPageSizeIsTen() {
                  assertEquals(10, ConfigStore.DEFAULT_HOME_CALL_PAGE_SIZE)
                  assertEquals(10, ConfigStore.migratedHomeCallPageSize(storedValue = null, migrationDone = false))
              }

              @Test
              fun oldDefaultTwentyMigratesOnceToTen() {
                  assertEquals(10, ConfigStore.migratedHomeCallPageSize(storedValue = 20, migrationDone = false))
                  assertEquals(20, ConfigStore.migratedHomeCallPageSize(storedValue = 20, migrationDone = true))
              }

              @Test
              fun explicitCustomPageSizeIsPreserved() {
                  assertEquals(15, ConfigStore.migratedHomeCallPageSize(storedValue = 15, migrationDone = false))
              }
          }
          EOF

          git rm .ci/pagination-fixes.patch
          git rm .github/workflows/export-source-inspection.yml
          git rm .github/workflows/apply-pagination-push.yml
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/calllog-android
          git commit -m "Use 10-row pages and preserve paging spinner"
          git push origin HEAD:agent/page-size-10-pagination
