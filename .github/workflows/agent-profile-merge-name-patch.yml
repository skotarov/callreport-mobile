name: Agent Profile Merge Name Patch

on:
  push:
    branches:
      - agent/profile-merge-name-choice-20260803

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-merge-name-choice-20260803
      - name: Connect name choice to server merge endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/CompanyAccountApi.kt')
          text = api.read_text()
          replacements = [
              (
                  '    private const val AUTH_PATH = "/relationship-manager/api/auth.php"\n',
                  '    private const val AUTH_PATH = "/relationship-manager/api/auth.php"\n'
                  '    private const val PROFILE_MERGE_PATH = "/relationship-manager/api/profile_merge.php"\n',
              ),
              (
                  '''    fun mergeProfiles(\n        context: Context,\n        mergeToken: String,\n    ): Result<ProfileUser> = requestJson(\n        context,\n        JSONObject()\n            .put("action", "merge_profiles")\n            .put("merge_token", mergeToken.trim()),\n        authenticated = true,\n    ).map { parseUser(it.optJSONObject("user")) }\n''',
                  '''    fun mergeProfiles(\n        context: Context,\n        mergeToken: String,\n        selectedDisplayName: String,\n    ): Result<ProfileUser> = requestJson(\n        context,\n        JSONObject()\n            .put("merge_token", mergeToken.trim())\n            .put("selected_display_name", selectedDisplayName.trim()),\n        authenticated = true,\n        path = PROFILE_MERGE_PATH,\n    ).map { parseUser(it.optJSONObject("user")) }\n''',
              ),
              (
                  '''    private fun requestJson(\n        context: Context,\n        payload: JSONObject,\n        authenticated: Boolean = false,\n    ): Result<JSONObject> = runCatching {\n''',
                  '''    private fun requestJson(\n        context: Context,\n        payload: JSONObject,\n        authenticated: Boolean = false,\n        path: String = AUTH_PATH,\n    ): Result<JSONObject> = runCatching {\n''',
              ),
              (
                  '        val connection = (URL(buildEndpoint(config.baseUrl, AUTH_PATH, emptyMap())).openConnection() as HttpURLConnection).apply {\n',
                  '        val connection = (URL(buildEndpoint(config.baseUrl, path, emptyMap())).openConnection() as HttpURLConnection).apply {\n',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'CompanyAccountApi block not found: {old[:80]!r}')
          api.write_text(text)

          editor = Path('mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ProfileEditorActivity.kt')
          text = editor.read_text()
          replacements = [
              (
                  '''                        ProfileMergeDialog.show(this, verification, channel) {\n                            mergeProfiles(verification.mergeToken)\n                        }\n''',
                  '''                        ProfileMergeDialog.show(this, verification, channel) { selectedName ->\n                            mergeProfiles(verification.mergeToken, selectedName)\n                        }\n''',
              ),
              (
                  '''    private fun mergeProfiles(mergeToken: String) {\n        setStatus("")\n        showLoading(true)\n        executor.execute {\n            val result = CompanyAccountApi.mergeProfiles(applicationContext, mergeToken)\n''',
                  '''    private fun mergeProfiles(mergeToken: String, selectedDisplayName: String) {\n        setStatus("")\n        showLoading(true)\n        executor.execute {\n            val result = CompanyAccountApi.mergeProfiles(\n                applicationContext,\n                mergeToken,\n                selectedDisplayName,\n            )\n''',
              ),
              (
                  '                        "Профилите са обединени. Текущият вход остава активен.",\n',
                  '                        "Профилите са обединени, а другият профил е изтрит. Текущият вход остава активен.",\n',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'ProfileEditorActivity block not found: {old[:80]!r}')
          editor.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "relationship-manager-agent"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/CompanyAccountApi.kt \
                  mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog/ProfileEditorActivity.kt
          git commit -m "Send selected name to server profile merge"
          git push origin HEAD:agent/profile-merge-name-choice-20260803
