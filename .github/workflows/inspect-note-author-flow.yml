name: Inspect Note Author Flow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-note-author-id
          fetch-depth: 0

      - name: Collect relevant Android source
        shell: bash
        run: |
          set -euo pipefail
          root='mobile/calllog-android/app/src'
          mkdir -p .agent
          report='.agent/note-author-inspection.txt'
          : > "$report"
          {
            echo 'HEAD:'
            git rev-parse HEAD
            echo
            echo 'MATCHING FILES:'
          } >> "$report"
          mapfile -t files < <(
            grep -RIlE 'authorIsOtherBroker|author(Name|Id|User)|user[_A-Za-z]*id|principal|currentUser|broker[_A-Za-z]*id|CallReportNoteOutbox|LocalNotesFileStore|Pending.*Note|call.*pending' "$root/main" "$root/test" 2>/dev/null \
              | grep -E '\.(kt|java)$' \
              | sort -u
          )
          printf '%s\n' "${files[@]}" >> "$report"
          echo >> "$report"
          for file in "${files[@]}"; do
            echo "===== FILE: $file =====" >> "$report"
            cat "$file" >> "$report"
            echo >> "$report"
          done
          perl -0pi -e 's/\n+\z/\n/' "$report"

      - name: Commit inspection report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-note-author-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Capture note author flow for inspection'
          git push origin HEAD:agent/fix-note-author-id
