name: Agent Note Move Inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect relevant Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          base=mobile/calllog-android/app/src/main/java/com/onlineimoti/calllog
          for file in \
            ContactNoteEditActivity.kt \
            ContactNoteEditUi.kt \
            ContactNoteTopicFieldUi.kt \
            ContactNoteTopicSelector.kt \
            ContactNoteScopeTextController.kt \
            ContactNoteScopeTextResolver.kt \
            OverlayContactNoteFormController.kt \
            PostCallUnifiedNoteEditor.kt \
            CallReportTopicSyncClient.kt \
            CompanyCallNoteOutbox.kt \
            CallReportTopicNoteOutbox.kt \
            CallReportCompanyGeneralNoteStore.kt \
            ServerRecordIndex.kt \
            ConfigStore.kt; do
            if [ -f "$base/$file" ]; then cp "$base/$file" "inspect/$file"; fi
          done
          grep -RInE "(OverlayContactNoteFormController|ContactNoteTopicFieldUi|serverClientEventId|onTopicControlReady|CallReportTopicSyncClient|TopicNoteOutbox)" "$base" > inspect/references.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: note-move-mobile-inspection
          path: inspect
          retention-days: 1
